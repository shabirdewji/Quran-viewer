<!DOCTYPE html>
<html>
<head>
    <title>Quran Viewer</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            background: #111;
            color: #fff;
        }

        .topbar {
            padding: 15px;
            background: #1c1c1c;
            position: sticky;
            top: 0;
        }

        select {
            padding: 8px;
            font-size: 14px;
        }

        .container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }

        .verse {
            padding: 12px;
            border-bottom: 1px solid #333;
        }

        .ayah {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 5px;
        }
        .ayahnum {
            color: #888;
            margin-right: 6px;
            font-weight: 500;
        }

        .text {
            font-size: 16px;
            line-height: 1.6;
        }



        .actions {
            margin-top: 6px;
            font-size: 13px;
            color: #aaa;
        }

        .actions a {
            color: #aaa;
            text-decoration: none;
            margin-right: 12px;
        }

        .read {
            opacity: 0.6;
        }

        .pinned {
            background: rgba(0, 150, 255, 0.15);
            border-left: 3px solid #00aaff;
            padding-left: 8px;
        }

        .resume-btn {
            display: inline-block;
            padding: 8px 12px;
            background: #1e90ff;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .resume-btn:hover {
            background: #1877d6;
        }
    </style>
</head>

<body>

<div class="topbar">
    <form method="get" style="display:inline-block;">
        <label>Surah:</label>

        <select name="surah" onchange="this.form.submit()">
            {% for s in surahs %}
                <option value="{{ s }}" {% if s == selected_surah %}selected{% endif %}>
                    {{ s }} - {{ surah_names[s] }}
                </option>
            {% endfor %}
        </select>
    </form>


    <a href="/resume" class="resume-btn">
    📖 Resume Reading
    </a>

    <form action="/clear_progress" method="POST" style="display:inline;">
        <button onclick="clearProgress()">
            🗑️ Clear Progress
        </button>
    </form>

    <a href="https://en.wikipedia.org/wiki/{{ surah_names[selected_surah]|replace(' ', '_') }}"
   target="_blank">
    📖 Surah Explanation
    </a>

</div>

{% for v in verses %}
<div class="verse" id="v-{{ v.surah }}-{{ v.ayah }}">

    <div class="text">
        <span class="ayahnum">{{ v.ayah }}.</span>
        {{ v.text }}
    </div>

    <div class="actions">

        <input type="checkbox"
            {% if v.is_read %}
                checked
            {% endif %}
            onchange="markRead(this, '{{ v.surah }}', '{{ v.ayah }}')">



        <a href="/toggle_bookmark/{{ v.rowid }}">
            {% if v.is_bookmarked %}⭐ Bookmarked{% else %}☆ Bookmark{% endif %}
        </a>


        <a href="#"
        onclick="setPin(this, '{{ v.surah }}', '{{ v.ayah }}'); return false;">
            📍
        </a>

        <a href="https://quran.com/{{ v.surah }}/{{ v.ayah }}"
       target="_blank" rel="noopener noreferrer">
        📖 Explain
        </a>

    </div>

</div>
{% endfor %}

</body>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const surah = Number("{{ selected_surah }}");
    const ayah = Number("{{ selected_ayah|default(1) }}");

    const el = document.getElementById(`ayah-${surah}-${ayah}`);

    if (!el) {
        console.log("Verse not found:", surah, ayah);
        return;
    }

    setTimeout(() => {
        el.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        el.style.background = "#222";
        el.style.borderRadius = "8px";
    }, 200);

});


function markRead(el, surah, ayah) {
    const isRead = el.checked ? 1 : 0;

    fetch("/mark-read", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            surah: surah,
            ayah: ayah,
            is_read: isRead
        })
    });
}


function markProgress(el, surah, ayah) {

    fetch(`/mark_progress/${surah}/${ayah}`)
        .then(() => {
            el.innerText = "PINNED";
            el.style.color = "green";
        });

}

function clearProgress() {
    fetch("/clear_progress", {
        method: "POST"
    })
    .then(() => {
        console.log("Progress cleared");
    });
}

function setPin(el, surah, ayah) {

    fetch(`/mark_progress/${surah}/${ayah}`)
        .then(() => {

            // remove old pin highlight
            document.querySelectorAll(".verse").forEach(v => {
                v.classList.remove("pinned");
            });

            // add new highlight
            const verse = document.getElementById(`v-${surah}-${ayah}`);
            if (verse) {
                verse.classList.add("pinned");
            }

            // optional UI feedback
            el.innerText = "PINNED";
            el.style.color = "green";
        });
}

window.onload = function () {

    const pinned = document.getElementById("v-{{ pinned_surah }}-{{ pinned_ayah }}");

    if (pinned) {
        pinned.classList.add("pinned");
        pinned.scrollIntoView({ behavior: "smooth", block: "center" });
    }
}

</script>
</html>
