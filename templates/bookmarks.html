.bookmark-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 4px;
    padding: 5px;
}
.card {
    
    border: 1px solid var(--border);
    border-radius: 14px;

    background: var(--card-bg) !important;
    color: var(--text);

    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

.card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
}

.card.playing {
    border: 1px solid var(--accent);
    background: rgba(250, 204, 21, 0.10);
    box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.15);
}

#playerBox .ayah-row.active {
    background: rgba(250, 204, 21, 0.25) !important;
    border-left: 4px solid #facc15 !important;
    transition: all 0.2s ease;
}
.ayah-card.active,
.ayah-row.active,
.card.playing {
    background: var(--active-bg);
    border-left: 4px solid var(--active-border);
    box-shadow: 0 0 12px rgba(250, 204, 21, 0.15);
}
.ayah-card {
    display: flex;
    align-items: flex-start;
    gap: 12px;

    padding: 12px 14px;
    margin: 10px 0;

    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

.ayah-number {
    min-width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    background: var(--accent);
    color: #111;
    font-weight: bold;
}

.ayah-content {
    flex: 1;
    text-align: left;
}

.player-ayah-ref {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
}

.player-ayah-text {
    font-size: var(--ayah-font-size, 22px);
    line-height: 1.8;
    color: var(--text);
}

.card-ref {
    font-size: 13px;
    color: var(--muted);
}

.card-label {
    font-size: 15px;
    color: var(--text);
    line-height: 1.4;
}
.card-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}

button {
    border: none;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    transition: 0.15s ease;
}

button:hover {
    background: var(--accent);
    color: #111;

<body>

<button onclick="goBackToSurah()" class="back-btn">
    ← Back to Surah
</button>

<div class="player-title"></div>
<div id="playerBox" class="player-box"></div>
<div id="playerList"></div>

<h2>Bookmarked Verses</h2>

<div id="list" class="bookmark-grid">Loading...</div>

<script>
const currentAudio = new Audio();
let currentHighlightId = null;
let currentPlaybackToken = 0;
let currentPlayingCard = null;

document.addEventListener("DOMContentLoaded", setupTheme);
document.addEventListener("DOMContentLoaded", loadBookmarks);

function setupTheme() {
    const saved = localStorage.getItem("theme") || "dark";
    document.body.classList.toggle("light", saved === "light");
}

function loadBookmarks() {
    fetch("/api/bookmarks")
        .then(r => r.json())
        .then(renderBookmarks);
}

function renderBookmarks(data) {

    const box = document.getElementById("list");
    box.innerHTML = "";

    (data.bookmarks || []).forEach(v => {

        const card = document.createElement("div");

        // ✅ THIS IS WHERE IT GOES
        card.className = "card ayah-row";
        card.id = `card-${v.id}`;
        card.dataset.ayah = v.ayah;

        card.innerHTML = `
            <div class="card-ref">${v.surah}:${v.ayah}</div>
            <div class="card-label">${v.label || ""}</div>

            <div class="card-actions">
                <button class="btn btn-ghost play-btn">🔊</button>
                <button class="delete-btn">🗑️</button>
            </div>
        `;

        card.querySelector(".play-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            playAyah(v.surah, v.ayah, v.id);
        });

        card.querySelector(".delete-btn").addEventListener("click", async (e) => {
            e.stopPropagation();
            await fetch(`/bookmark/${v.id}`, { method: "DELETE" });
            loadBookmarks();
        });

        box.appendChild(card);
    });
}

function playAyah(surah, ayah, cardId) {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }
    currentPlaybackToken++;
    const ayahStr = String(ayah);
    let ayahs = [];

    if (ayahStr.includes("-")) {
        const parts = ayahStr.split("-");
        const start = parseInt(parts[0]);
        const end = parseInt(parts[1]);

        for (let i = start; i <= end; i++) {
            ayahs.push(i);
        }
    } else {
        ayahs.push(parseInt(ayahStr));
    }

    setActiveCard(cardId);

    showPlayerWindow(surah, ayahs);
    playSequentially(surah, ayahs, 0);
}

async function showPlayerWindow(surah, ayahs) {

    const box = document.getElementById("playerBox");

    if (!box) {
        console.error("playerBox not found");
        return;
    }

    // show window
    box.style.display = "block";
    box.style.visibility = "visible";
    box.style.opacity = "1";

    // reset content
    box.innerHTML = `
        <div class="player-header">
            Now Playing Hello
        </div>
        <div id="playerList"></div>
    `;

    const list = document.getElementById("playerList");

    // render placeholders
ayahs.forEach(a => {

    const card = document.createElement("div");

    card.id = `play-${a}`;
    card.className = "ayah-card";   // changed from ayah-row
    card.dataset.ayah = a;

    card.innerHTML = `
        <div class="ayah-number">
            ${a}
        </div>

        <div class="ayah-content">
            <div class="player-ayah-ref">
                ${surah}:${a}
            </div>

            <div class="player-ayah-text">
                Loading...
            </div>
        </div>
    `;

    list.appendChild(card);
});

    console.log("Player window opened - SHABIR IS GREAT", surah, ayahs);

    // fetch verses in background
    for (const a of ayahs) {

        try {
            const res = await fetch(`/api/ayah/${surah}/${a}`);
            const data = await res.json();

            const el = document.getElementById(`play-${a}`);
            if (!el) continue;

            el.innerHTML = `
                <div class="player-ayah-ref">
                    ${surah}:${a}
                </div>

                <div class="player-ayah-text">
                    ${data.text || "Not found"}
                </div>
            `;

        } catch (err) {
            console.error("Failed loading ayah", surah, a, err);
        }
    }
}

function playSequentially(surah, ayahs, index, token = currentPlaybackToken) {
    if (token !== currentPlaybackToken) return;
    if (index >= ayahs.length) {
        if (currentPlayingCard) {
            currentPlayingCard.classList.remove("playing");
            currentPlayingCard = null;
        }

        document.getElementById("playerBox").style.display = "none";
        return;
    }

    const ayah = ayahs[index];

    // 🔥 optional: update player window highlight too
    setActiveAyah(ayah);

    const surahPadded = String(surah).padStart(3, '0');
    const ayahPadded = String(ayah).padStart(3, '0');

    currentAudio.src =
        `https://everyayah.com/data/Alafasy_128kbps/${surahPadded}${ayahPadded}.mp3`;

    currentAudio.play();

    currentAudio.onended = () => {
        if (token !== currentPlaybackToken) return;
        playSequentially(surah, ayahs, index + 1, token);
    };
}

function setActiveCard(cardId) {
    // remove previous
    if (currentPlayingCard) {
        currentPlayingCard.classList.remove("playing");
        currentPlayingCard = null;
    }

    // add new
    if (!cardId) return;
    const card = document.getElementById(`card-${cardId}`);

    if (card) {
        card.classList.add("playing");
        currentPlayingCard = card;
    }
}

function setActiveAyah(ayah) {

    console.log("🔥 setActiveAyah CALLED:", ayah);

    const selector = `.ayah-row[data-ayah="${ayah}"]`;
    console.log("🔎 Looking for:", selector);

    const mainEl = document.querySelector(
    `#list .ayah-row[data-ayah="${ayah}"]`
    );
    console.log("📦 mainEl found:", mainEl);

    const playerEl = document.getElementById(`play-${ayah}`);
    console.log("🎧 playerEl found:", playerEl);

    if (!mainEl) {
        console.warn("❌ MAIN AYAH NOT FOUND IN DOM");
    }

    if (!playerEl) {
        console.warn("❌ PLAYER AYAH NOT FOUND");
    }

    // clear old
    document.querySelectorAll("#list .active, #playerBox .active")
        .forEach(el => el.classList.remove("active"));

    // apply new
    if (mainEl) mainEl.classList.add("active");
    if (playerEl) {
        playerEl.classList.add("active");

        console.log("📜 scrolling into view:", playerEl);

        playerEl.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}

function goBackToSurah() {
    window.location.href = "/view/1/1";
}


</script>
