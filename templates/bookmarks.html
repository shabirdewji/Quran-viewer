<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="/static/favicon.ico">
    <title>Bookmarks</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        .verse {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .left {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .ref {
            color: #888;
            font-size: 13px;
        }

        .label-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .label {
            color: #fff;
        }

        .speaker-btn {
            background: none;
            border: none;
            color: #6aa9ff;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }

        .speaker-btn:hover {
            opacity: 0.8;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            align-items: center;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .open {
            color: #6aa9ff;
            text-decoration: none;
            padding: 6px 10px;
        }

        .back-btn {
            margin-bottom: 20px;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }
        .bookmark-card {
            display: grid;
            grid-template-columns: 120px 1fr 40px 70px 80px;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid #333;
            transition: all 0.25s ease;
            }


        .bookmark-card.playing {
            border: 2px solid #6aa9ff;
            box-shadow: 0 0 18px rgba(106,169,255,0.5);
            transform: scale(1.03);
            background: #1c2533;
        }

    .col-ref {
        color: #888;
        font-size: 13px;
    }

    .col-label {
        color: #fff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .btn {
        border: none;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
    }

    .btn-open {
        background: #222;
        color: #6aa9ff;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .btn-delete {
        background: #e53935;
        color: white;
    }

    .speaker-btn {
        background: none;
        border: none;
        color: #6aa9ff;
        cursor: pointer;
        font-size: 16px;
    }

    .bookmark-grid {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 10px;
}

    .bookmark-card {
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 50px;
    }

    .card-ref {
        color: #888;
        font-size: 12px;
    }

    .card-label {
        color: #fff;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
    }

    .speaker-btn {
        background: none;
        border: none;
        color: #6aa9ff;
        font-size: 16px;
        cursor: pointer;
    }

    .btn-open, .btn-delete {
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
    }

    .btn-open {
        background: #222;
        color: #6aa9ff;
        text-decoration: none;
    }

    .btn-delete {
        background: #e53935;
        color: white;
    }

    </style>
</head>

<body>

<button onclick="goBackToSurah()" class="back-btn">
    ← Back to Surah
</button>

<div id="playerBox"
    style="
        position:fixed;
        bottom:20px;
        right:20px;
        width:300px;
        height:300px;
        background:#1a1a1a;
        border:2px solid #6aa9ff;
        border-radius:12px;
        z-index:999999;
        overflow-y:auto;
        padding:10px;
        display:none;
        color:white;
        box-shadow:0 0 20px rgba(0,0,0,0.8);
    ">

    <div style="
        font-size:16px;
        font-weight:600;
        margin-bottom:10px;
        color:#6aa9ff;
    ">
        Now Playing
    </div>

    <div id="playerList"></div>

</div>


<h2>Bookmarked Verses</h2>

<div id="list" class="bookmark-grid">Loading...</div>

<script>

const currentAudio = new Audio();
let currentHighlightId = null;
let currentPlaybackToken = 0;
let currentPlayingCard = null;

document.addEventListener("DOMContentLoaded", () => {
    loadBookmarks();
});

function loadBookmarks() {

    fetch("/api/bookmarks")
        .then(r => r.json())
        .then(data => {

            const box = document.getElementById("list");
            box.innerHTML = "";

            (data.bookmarks || []).forEach(v => {

                const div = document.createElement("div");
                

div.innerHTML = `
    <div class="bookmark-card"
        id="card-${v.id}"
        onclick="playAyah('${v.surah}', '${v.ayah}', '${v.id}')"
        style="cursor:pointer;">

        <div class="card-ref">
            ${v.surah}:${v.ayah}
        </div>

        <div class="card-label">
            ${v.label || ""}
        </div>



    </div>
`;

                box.appendChild(div);
            });
        });
}



//        <div class="card-actions">

//            <a class="btn-open"
//                href="/view/${v.surah}/${v.ayah}"
//                onclick="event.stopPropagation();">
//                Open
//            </a>

//            <button class="btn-delete"
//                onclick="event.stopPropagation(); deleteBookmark(${v.id})">
//                Del
//            </button>

//        </div>







function playAyah(surah, ayah, cardId) {

    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    // invalidate old playback chain
    currentPlaybackToken++;

    let ayahs = [];

    const ayahStr = String(ayah);
    // remove previous highlight
    if (currentPlayingCard) {
        currentPlayingCard.classList.remove("playing");
    }

    // highlight current card
    const card = document.getElementById(`card-${cardId}`);

    if (card) {
        card.classList.add("playing");
        currentPlayingCard = card;
    }

    if (ayahStr.includes("-")) {
        const parts = ayahStr.split("-");
        const start = parseInt(parts[0]);
        const end = parseInt(parts[1]);

        for (let i = start; i <= end; i++) {
            ayahs.push(i);
        }
    } else {
        ayahs.push(parseInt(ayahStr));
    }

    // 🔥 FORCE window BEFORE playback (no dependency on recursion)
    showPlayerWindow(surah, ayahs);

    // start playback
    playSequentially(surah, ayahs, 0);
}

async function showPlayerWindow(surah, ayahs) {

    const box = document.getElementById("playerBox");

    if (!box) {
        console.error("playerBox not found");
        return;
    }

    // show window
    box.style.display = "block";
    box.style.visibility = "visible";
    box.style.opacity = "1";

    // reset content
    box.innerHTML = `
        <div style="
            font-size:16px;
            font-weight:600;
            margin-bottom:10px;
            color:#6aa9ff;
        ">
            Now Playing
        </div>
        <div id="playerList"></div>
    `;

    const list = document.getElementById("playerList");

    // render placeholders first (instant UI)
    ayahs.forEach(a => {
        const row = document.createElement("div");

        row.id = `play-${a}`;
        row.style.padding = "10px";
        row.style.marginBottom = "8px";
        row.style.borderBottom = "1px solid #333";
        row.style.color = "#888";

        row.innerHTML = `
            <div style="font-size:12px;color:#6aa9ff;margin-bottom:4px;">
                ${surah}:${a}
            </div>
            <div>Loading...</div>
        `;

        list.appendChild(row);
    });

    console.log("Player window opened", surah, ayahs);

    // fetch verses in background
    for (const a of ayahs) {

        try {
            const res = await fetch(`/api/ayah/${surah}/${a}`);
            const data = await res.json();

            const el = document.getElementById(`play-${a}`);
            if (!el) continue;

            el.innerHTML = `
                <div style="font-size:12px;color:#6aa9ff;margin-bottom:6px;">
                    ${surah}:${a}
                </div>

                    <div style="
                        font-size:28px;
                        line-height:1.9;
                        text-align:center;
                        color:#fff;
                        padding:20px;
                        max-width:700px;
                        margin:0 auto;
                    ">
                    ${data.text || "Not found"}
                </div>
            `;

        } catch (err) {
            console.error("Failed loading ayah", surah, a, err);
        }
    }
}



function playSequentially(surah, ayahs, index, token = currentPlaybackToken) {

    // stop old playback chains
    if (token !== currentPlaybackToken) {
        return;
    }

    if (index >= ayahs.length) {

        // close player window
        const box = document.getElementById("playerBox");

        if (box) {
            box.style.display = "none";
        }

        if (currentPlayingCard) {
            currentPlayingCard.classList.remove("playing");
        }

        return;
    }

    const ayah = ayahs[index];

    // remove old highlight
    if (currentHighlightId) {
        const prev = document.getElementById(currentHighlightId);

        if (prev) {
            prev.style.color = "#aaa";
            prev.style.fontWeight = "normal";
        }
    }

    // highlight current
    const el = document.getElementById(`play-${ayah}`);

    if (el) {
        el.style.color = "#6aa9ff";
        el.style.fontWeight = "600";

        el.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        currentHighlightId = el.id;
    }

    const surahPadded = String(surah).padStart(3, '0');
    const ayahPadded = String(ayah).padStart(3, '0');

    currentAudio.src =
        `https://everyayah.com/data/Alafasy_128kbps/${surahPadded}${ayahPadded}.mp3`;

    currentAudio.play();

    currentAudio.onended = () => {

        // ignore stale chains
        if (token !== currentPlaybackToken) {
            return;
        }

        playSequentially(surah, ayahs, index + 1, token);
    };
}




function goBackToSurah() {
    window.location.href = "/view/1/1";
}

function deleteBookmark(id) {

    fetch(`/bookmark/${id}`, {
        method: "DELETE"
    })
    .then(() => loadBookmarks());
}

</script>

</body>
</html>
