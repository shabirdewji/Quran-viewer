<!DOCTYPE html>
<html>
<style>
.verse {
    padding: 10px 0;
    border-bottom: 1px solid #333;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
}

.left {
    display: flex;
    flex-direction: row;
    gap: 10px;
    align-items: center;
    overflow: hidden;
}

.ref {
    color: #888;
    font-size: 13px;
    flex-shrink: 0;
}

.label {
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
    color: #fff;
}

.actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.delete-btn {
    background: #e53935;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 8px;
}

.open {
    color: #6aa9ff;
    text-decoration: none;
    padding: 6px 10px;
}
</style>
<head>
    <title>Bookmarks</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        .verse {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        .ref {
            color: #888;
            margin-bottom: 8px;
        }

        a {
            color: #6aa9ff;
            text-decoration: none;
        }
    </style>
</head>

<body>
<button onclick="goBackToSurah()" class="back-btn">
    ← Back to Surah
</button>


<h2>Bookmarked Verses</h2>

<div id="list">Loading...</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    loadBookmarks();
});

function loadBookmarks() {
    fetch("/api/bookmarks")
        .then(r => r.json())
        .then(data => {

            const box = document.getElementById("list");
            box.innerHTML = "";

            (data.bookmarks || []).forEach(v => {

                const div = document.createElement("div");
                div.className = "verse";

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">

                        <div>
                            <div style="color:#888;font-size:13px;">
                                ${v.surah}:${v.ayah}
                            </div>

                            <div>
                                ${v.label || ""}
                            </div>
                        </div>

                        <div>
                            <a href="/view/${v.surah}/${v.ayah}">Open</a>

                            <button class="delete-btn" onclick="deleteBookmark(${v.id})">
                                Delete
                            </button>
                        </div>

                    </div>
                `;

                box.appendChild(div);
            });
        });
}
function goBackToSurah() {
    window.location.href = "/view/1/1"; // or your default
}

function deleteBookmark(id) {
    fetch(`/bookmark/${id}`, { method: "DELETE" })
        .then(() => loadBookmarks());
}
</script>

</body>
</html>
