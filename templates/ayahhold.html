<!DOCTYPE html>
<html>
<head>
    <title>Quran Reader</title>

    <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='icon.png') }}">

    <link rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/viewer.css') }}">
          <link rel="stylesheet" href="/static/css/theme.css">
          <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0" rel="stylesheet">    
</head>

<body>

<!--
<div id="surah" style="display:none"></div>
<div id="ayah" style="display:none"></div>
-->

<div class="app">

    <!-- LEFT CONTROLS -->
    <div class="left-controls">
    <div class="tool-group compact">
        <button class="tool-btn" onclick="pinAyah()">📌 Pin</button>
        <button class="tool-btn" onclick="addBookmark()">🔖 Bookmark</button>
        <button class="tool-btn" onclick="window.location.href='/bookmarks'">📚 View Bookmarks</button>
    </div>
    <div class="tool-group compact">
        <button class="tool-btn" onclick="changeFontSize(-2)">A−</button>
        <button class="tool-btn" onclick="event.stopPropagation(); changeFontSize(2)">A+</button>
        <button class="tool-btn" onclick="toggleTheme()">🌓 Dark/Light</button>
    </div>
    <div class="tool-group compact">
        <button class="tool-btn" onclick="playAyah()">🔊 Play Ayah</button>
        <button class="tool-btn" onclick="playSurah()">📖 Play Surah</button>
<!--        <button class="tool-btn" onclick="togglePause()">⏸ Pause</button> -->
    </div>
    <div id="pinStatus"></div>
    </div>

<!-- TOP BAR -->
    <div class="topbar">
        <div class="search-bar">
            <!-- SURAH DROPDOWN -->
            <select id="surahSelect">
                {% for num, name in surah_names.items() %}
                    <option value="{{ num }}"
                        {% if num == surah %}selected{% endif %}>
                        {{ num }} - {{ name }}
                    </option>
                {% endfor %}
            </select>

            <button data-action="prev-surah" class="summary-btn">Prev</button>
            <button data-action="next-surah" class="summary-btn">Next</button>

            <div class="surah-search" id="surahSearchBox">
                <input id="surahSearchInput" class="summary-btn" type="text" placeholder="Search surah..." autocomplete="off">
                <div id="surahSearchResults" class="search-results"></div>
            </div>

            <button id="summaryBtn" class="summary-btn">
            Summary
            </button>

            <button id="markReadBtn" class="summary-btn">Mark Read</button>

            <!-- AYAH DROPDOWN -->
            <select id="ayahSelect"></select>

            <button data-action="prev-ayah" class="summary-btn">Prev</button>
            <button data-action="next-ayah" class="summary-btn">Next</button>

            <!-- CONTINUE -->
            <button class="summary-btn" onclick="goContinue()">
                GoTo Pinned
            </button>
            <div id="progressDisplay" class="progress-display">0%</div>
        </div>
    </div>

    <div class="main">

<!-- VIEW -->
    <div class="page">
        <div class="reader">
            {% for verse in verses %}
            <div class="ayah-row" id="ayah-{{ current_surah }}-{{ verse.ayah }}" data-ayah="{{ verse.ayah }}">
                <div class="ayah-card">

                    <input type="checkbox"
                        class="read-toggle"
                        {% if verse.is_read %}checked{% endif %}>

                    <div class="note-dot"></div>

                    <div class="ayah-number">
                        {{ verse.ayah }}
                    </div>

                    <div class="ayah" data-ayah="{{ verse.ayah }}">
                        {{ verse.text }}
                    </div>

                </div>
                <div class="note-popup hidden">
                    <div class="note-header">
                    Notes. Write your reflection here...
                    </div>
                    <textarea class="note-text"></textarea>
                    <div class="note-actions">
                        <button class="save-note">Save</button>
                        <button class="close-note">Close</button>
                    </div>
                    <div class="ayahText"></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    </div>
</div>

<!-- ✅ GLOBAL UI ELEMENTS (ONLY ONCE) -->

<div id="summaryPopup" class="popup-content hidden">
    <textarea id="summaryText"></textarea>
    <div class="summary-actions">
        
        <button class="summary-btn externalLink"
                data-url="https://quranyusufali.com/{surah}/">
            Yusuf Ali
        </button>

        <button class="summary-btn wikiLink">
            📖 Wiki
        </button>

        <button class="summary-btn" id="saveSummary">💾 Save</button>
        <button class="summary-btn" id="closeSummary">Close</button>
    </div>
</div>
<div id="popup" class="popup hidden"></div>


<!-- AUDIO -->
<audio id="audioPlayer"></audio>

<div id="audioTray" class="audio-tray hidden">
    <div class="tray-info" id="trayInfo">🔊 Playing</div>

    <div class="tray-controls">
        <button class="tray-btn" onclick="goPrevAyah()">⏮</button>
        <button class="tray-btn" onclick="togglePause()">⏸</button>
        <button class="tray-btn" onclick="goNextAyah()">⏭</button>
        <button class="tray-btn" onclick="closeTray()">✖</button>
    </div>
</div>

<script>

window.pageData = {
    surah: {{ current_surah | tojson }},
    ayah: {{ current_ayah | tojson }},
    nextUrl: {{ next_url | tojson }},
    prevUrl: {{ prev_url | tojson }}
};

window.surahCounts =
    {{ surah_counts | tojson }};

</script>

<script>
const surahs = Object.entries({{ surah_names | tojson }}).map(([num, name]) => ({
    number: parseInt(num),
    name: name
}));
</script>

<script src="{{ url_for('static', filename='js/viewer.js') }}"></script>

</body>
</html>
