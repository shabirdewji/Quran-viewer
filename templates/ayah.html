<!DOCTYPE html>
<html>
<head>
    <title>Quran Reader</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/viewer.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- LEFT CONTROLS -->
    <div class="left-controls">

        <button onclick="pinAyah()">📌</button>
        <button onclick="addBookmark()">🔖</button>
        <button onclick="toggleBookmarks()">📚</button>

        <button onclick="changeFontSize(-5)">A−</button>
        <button onclick="changeFontSize(5)">A+</button>
        <button onclick="toggleTheme()">🌓</button>

        <button onclick="playAyah()">🔊</button>
        <button onclick="playSurah()">📖</button>
        <button onclick="togglePause()">⏸️</button>

        <label>
            <input type="checkbox" onchange="toggleRead(this)">
            Read
        </label>

    </div>

    <!-- MAIN AREA -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <div class="surah">
                {{ verse.surah_name }}
            </div>

            <div class="search-bar">

                <select id="surahSelect" onchange="changeSurah()">
                    {% for num in surahs %}
                        <option value="{{ num }}"
                            {% if num == verse.surah %}selected{% endif %}>
                            {{ num }} — {{ surah_names[num] }}
                        </option>
                    {% endfor %}
                </select>

                <select id="ayahSelect" onchange="changeAyah()"></select>

                <div class="ayah-info">
                    Ayah {{ verse.ayah }} /
                    <span id="totalAyahs">?</span>
                </div>

                <div class="top-actions">
                    <button class="continue-top" onclick="goContinue()">
                    Continue
                    </button>
                </div>

            </div>
        </div>

        <!-- VIEW AREA -->
        <div class="page">

            <!-- READER VIEW -->
            <div class="reader">
                <div class="ayah" id="ayah-{{ verse.ayah }}">
                    {{ verse.text }}
                </div>
            </div>

            <!-- BOOKMARK VIEW (MAIN AREA) -->
            <div id="bookmarkView" style="display:none;">
                <h2>Bookmarks</h2>
                <div id="bookmarkList"></div>
            </div>

            <!-- SURAH VIEW (FULL LIST MODE) -->
            <div id="surahView" style="display:none;"></div>

        </div>

        <!-- NAVIGATION ARROWS -->

        <div class="nav-arrows">
            <button id="prevBtn" class="glass-btn">❮</button>
            <button id="nextBtn" class="glass-btn">❯</button>
        </div>


    </div>
</div>

<!-- GLOBAL UI ELEMENTS -->
<div id="toast" class="toast"></div>
<audio id="audioPlayer"></audio>

<!-- DATA -->
<script>
window.pageData = {
    surah: {{ verse.surah | tojson }},
    ayah: {{ verse.ayah | tojson }},
    nextUrl: {{ next_url | tojson }},
    prevUrl: {{ prev_url | tojson }}
};

window.surahCounts = {{ surah_counts | tojson }};
</script>

<script src="{{ url_for('static', filename='js/hold.js') }}"></script>

</body>
</html>
