<!DOCTYPE html>
<html>
<head>
    <title>Quran Reader</title>

    <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='icon.png') }}">

    <link rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/viewer.css') }}">
          <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
          
</head>

<body>

<div id="surah" style="display:none"></div>
<div id="ayah" style="display:none"></div>

<div class="app">

    <!-- LEFT CONTROLS -->
    <div class="left-controls">
    <div class="tool-group compact">
        <button class="tool-btn" onclick="pinAyah()">📌 Pin</button>
        <button class="tool-btn" onclick="addBookmark()">🔖 Bookmark</button>
        <button class="tool-btn" onclick="window.location.href='/bookmarks'">📚 View Bookmarks</button>
    </div>
    <div class="tool-group compact">
        <button class="tool-btn" onclick="changeFontSize(-2)">A−</button>
        
        <button class="tool-btn" onclick="event.stopPropagation(); changeFontSize(2)">A+</button>
        <button class="tool-btn" onclick="toggleTheme()">🌓 Dark/Light</button>
    </div>
    <div class="tool-group compact">
        <button class="tool-btn" onclick="playAyah()">🔊 Play Ayah</button>
        <button class="tool-btn" onclick="playSurah()">📖 Play Surah</button>
        <button class="tool-btn" onclick="togglePause()">⏸ Pause</button>
    </div>
    <div id="pinStatus">Not pinned</div>
<!--
        <button onclick="goPrevAyah()">◀</button>
        <button onclick="goNextAyah()">▶</button>
-->
    </div>
    

    <!-- MAIN -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <div class="surah">
                {{ surah_names[surah] }}
            </div>

            <div class="search-bar">

                <!-- SURAH DROPDOWN -->
                <select id="surahSelect">
                    {% for num, name in surah_names.items() %}
                        <option value="{{ num }}"
                            {% if num == surah %}selected{% endif %}>
                            {{ num }} - {{ name }}
                        </option>
                    {% endfor %}
                </select>

                <button id="summaryBtn" class="summary-btn">
                Summary
                </button>

                <!-- AYAH DROPDOWN -->
                <select id="ayahSelect"></select>

                <!-- AYAH INFO -->
                <div class="ayah-info">
                    Ayah
                    <span id="currentAyah">1</span>
                    /
                    <span id="totalAyahs">?</span>
                </div>

                <!-- CONTINUE -->
                <button class="continue-top"
                        onclick="goContinue()">
                    Continue
                </button>
            </div>
        </div>

        <!-- VIEW -->
        <div class="page">


        <div class="reader">
            {% for verse in verses %}
            <div class="ayah-row" id="ayah-{{ verse.ayah }}" data-ayah="{{ verse.ayah }}">
            <div class="ayah-card">

                <input type="checkbox"
                    class="read-toggle"
                    {% if verse.is_read %}checked{% endif %}>

                <div class="note-dot"></div>

                <div class="ayah-number">
                    {{ verse.ayah }}
                </div>

                <div class="ayah">
                    {{ verse.text }}
                </div>

            </div>
                <div class="note-popup hidden">
                    <div class="note-header">
                        Notes
                    </div>
                        <textarea class="note-text"
                                placeholder="Write your reflection here..."></textarea>

                    <div class="note-preview"></div>

                    <div class="note-actions">
                        
                        <button class="save-note">Save</button>
                        <button class="close-note">Close</button>
                    </div>

                    <div id="ayahText"></div>

                </div>
            </div>
            {% endfor %}
        </div>

        </div>
    </div>
</div>

<!-- NAV FLOAT -->
<div class="nav-arrows">

<button id="prevBtn" class="glass-btn">
    <span class="material-symbols-rounded">chevron_left</span>
</button>

<button id="nextBtn" class="glass-btn">
    <span class="material-symbols-rounded">chevron_right</span>
</button>

</div>

        <!-- ✅ GLOBAL UI ELEMENTS (ONLY ONCE) -->

<div id="summaryPopup" class="popup-content hidden">
    <div id="summaryText"></div>

    <button id="closeSummary">Close</button>
</div>
 <div id="popup" class="popup hidden"></div>
<!-- AUDIO -->
<audio id="audioPlayer"></audio>

<!-- DATA -->

<script>

window.pageData = {
    surah: {{ current_surah | tojson }},
    ayah: {{ current_ayah | tojson }},
    nextUrl: {{ next_url | tojson }},
    prevUrl: {{ prev_url | tojson }}
};

window.surahCounts =
    {{ surah_counts | tojson }};

</script>

<script src="{{ url_for('static', filename='js/viewer.js') }}"></script>

</body>
</html>
