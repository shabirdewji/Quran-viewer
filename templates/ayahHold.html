<!DOCTYPE html>
<html>
<head>
    <title>Quran Reader</title>

    <link rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='icon.png') }}">

    <link rel="shortcut icon"
      href="{{ url_for('static', filename='favicon.ico') }}">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/viewer.css') }}">
          <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
          
</head>

<body>

<div class="app">

    <!-- LEFT CONTROLS -->
    <div class="left-controls">

        <button onclick="pinAyah()">📌</button>
        <button onclick="addBookmark()">🔖</button>
        <button onclick="window.location.href='/bookmarks'">📚</button>

        <button onclick="changeFontSize(-2)">A−</button>
        <button onclick="changeFontSize(2)">A+</button>

        <button onclick="toggleTheme()">🌓</button>

        <button onclick="playAyah()">🔊</button>
        <button onclick="playSurah()">📖</button>
        <button onclick="togglePause()">⏸</button>

        <button onclick="goPrevAyah()">◀</button>
        <button onclick="goNextAyah()">▶</button>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">

            <div class="surah">
                {{ surah_names[surah] }}
            </div>

            <div class="search-bar">

                <!-- SURAH DROPDOWN -->
                <select id="surahSelect">
                    {% for num, name in surah_names.items() %}
                        <option value="{{ num }}"
                            {% if num == surah %}selected{% endif %}>
                            {{ num }} - {{ name }}
                        </option>
                    {% endfor %}
                </select>

                <!-- AYAH DROPDOWN -->
                <select id="ayahSelect"></select>

                <!-- AYAH INFO -->
                <div class="ayah-info">
                    Ayah
                    <span id="currentAyah">1</span>
                    /
                    <span id="totalAyahs">?</span>
                </div>

                <!-- CONTINUE -->
                <button class="continue-top"
                        onclick="goContinue()">
                    Continue
                </button>

            </div>
        </div>

        <!-- VIEW -->
        <div class="page">
            <div class="reader">
                {% for verse in verses %}
                <div class="ayah-block"
                     id="ayah-{{ verse.ayah }}">
                    <div class="ayah-number">
                        {{ verse.ayah }}
                    </div>
                    <div class="ayah">
                        {{ verse.text }}
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
</div>

<!-- NAV FLOAT -->
<div class="nav-arrows">

<button id="prevBtn" class="glass-btn">
    <span class="material-symbols-rounded">chevron_left</span>
</button>

<button id="nextBtn" class="glass-btn">
    <span class="material-symbols-rounded">chevron_right</span>
</button>

</div>

<div id="list"></div>
<div id="list">Loading...</div>
<!-- AUDIO -->
<audio id="audioPlayer"></audio>

<!-- DATA -->

<script>

window.pageData = {
    surah: {{ current_surah | tojson }},
    ayah: {{ current_ayah | tojson }},
    nextUrl: {{ next_url | tojson }},
    prevUrl: {{ prev_url | tojson }}
};

window.surahCounts =
    {{ surah_counts | tojson }};

</script>

<script src="{{ url_for('static',
filename='js/viewer.js') }}"></script>

</body>
</html>
